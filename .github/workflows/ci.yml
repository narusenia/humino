name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # Only packages/core: the Ableton SDK cannot be redistributed, so the
    # extension package is built and checked locally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: npm ci
      - run: mise run check
